<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Włoski z Polskim</title>
  <meta name="description" content="Darmowa nauka włoskiego dla Polaków – lekcje, powtórki, wymowa. Działa offline.">
  <meta name="theme-color" content="#1f8a4c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Włoski">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ekran powitalny (3 s) -->
  <div id="splash" class="splash" role="status" aria-label="Ładowanie">
    <div class="splash-inner">
      <div class="splash-bounce">
        <svg class="splash-pizza" aria-hidden="true" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="96" fill="#d4853a"/>

        <circle cx="100" cy="100" r="78" fill="#c0392b"/>
        <ellipse cx="100" cy="100" rx="62" ry="60" fill="#f9e07a"/>
        <ellipse cx="82" cy="85" rx="20" ry="16" fill="#fae98f" opacity="0.7"/>
        <ellipse cx="118" cy="115" rx="18" ry="14" fill="#fae98f" opacity="0.7"/>
        <ellipse cx="115" cy="80" rx="14" ry="11" fill="#fae98f" opacity="0.6"/>
        <ellipse cx="82" cy="118" rx="14" ry="11" fill="#fae98f" opacity="0.6"/>
        <circle cx="100" cy="72" r="11" fill="#a83222"/>
        <circle cx="100" cy="72" r="8" fill="#c0392b"/>
        <circle cx="72" cy="108" r="11" fill="#a83222"/>
        <circle cx="72" cy="108" r="8" fill="#c0392b"/>
        <circle cx="128" cy="108" r="11" fill="#a83222"/>
        <circle cx="128" cy="108" r="8" fill="#c0392b"/>
        <circle cx="100" cy="128" r="10" fill="#a83222"/>
        <circle cx="100" cy="128" r="7" fill="#c0392b"/>
        <circle cx="83" cy="87" r="8" fill="#a83222"/>
        <circle cx="83" cy="87" r="5.5" fill="#c0392b"/>
        <circle cx="118" cy="87" r="8" fill="#a83222"/>
        <circle cx="118" cy="87" r="5.5" fill="#c0392b"/>
        <circle cx="101" cy="69" r="2" fill="#e05040" opacity="0.6"/>
        <circle cx="73" cy="105" r="2" fill="#e05040" opacity="0.6"/>
        <circle cx="129" cy="105" r="2" fill="#e05040" opacity="0.6"/>
        <ellipse cx="90" cy="100" rx="9" ry="5" fill="#27ae60" transform="rotate(-30 90 100)"/>
        <ellipse cx="110" cy="100" rx="9" ry="5" fill="#27ae60" transform="rotate(30 110 100)"/>
        <ellipse cx="100" cy="100" rx="9" ry="5" fill="#2ecc71" transform="rotate(90 100 100)"/>
        <circle cx="100" cy="10" r="4" fill="#c47830" opacity="0.5"/>
        <circle cx="136" cy="22" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="64" cy="22" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="160" cy="55" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="40" cy="55" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="170" cy="100" r="4" fill="#c47830" opacity="0.5"/>
        <circle cx="30" cy="100" r="4" fill="#c47830" opacity="0.5"/>
        <circle cx="160" cy="145" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="40" cy="145" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="136" cy="178" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="64" cy="178" r="3" fill="#c47830" opacity="0.4"/>
        <circle cx="100" cy="190" r="4" fill="#c47830" opacity="0.5"/>
      </svg>
      </div>
      <div class="splash-title">Włoski z Polskim</div>
      <div class="splash-sub">Benvenuto! Ładowanie…</div>
      <div class="splash-bar"><div></div></div>
    </div>
  </div>
  <header class="topbar">
    <a class="brand" href="#nauka"><span class="brand-flag" aria-hidden="true"><i></i><i></i><i></i></span>Włoski</a>
    <div class="top-stats" id="topStats"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Nawigacja">
    <a href="#nauka" data-tab="nauka"><span>🏠</span>Nauka</a>
    <a href="#powtorki" data-tab="powtorki"><span>🔁</span>Powtórki</a>
    <a href="#slowka" data-tab="slowka"><span>📚</span>Słówka</a>
    <a href="#profil" data-tab="profil"><span>👤</span>Profil</a>
  </nav>

  <!-- ekran lekcji -->
  <div id="lesson" class="lesson hidden" role="dialog" aria-modal="true" aria-label="Lekcja">
    <header class="lesson-top">
      <button class="icon-btn" id="lessonClose" aria-label="Zakończ">✕</button>
      <div class="progress"><div id="lessonBar"></div></div>
      <span id="lessonCombo" class="combo"></span>
    </header>
    <main class="lesson-body" id="exBody"></main>
    <footer class="lesson-foot" id="exFoot">
      <div class="foot-inner">
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div class="foot-btns">
          <button class="btn ghost" id="skipBtn">Nie wiem</button>
          <button class="btn primary big" id="checkBtn" disabled>Sprawdź</button>
        </div>
      </div>
    </footer>
  </div>

  <div id="modal" class="modal hidden"><div class="sheet" id="modalSheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status"></div>

  <noscript><p style="padding:2rem">Ta aplikacja wymaga włączonej obsługi JavaScript.</p></noscript>

  <script src="js/course.js"></script>
  <script src="js/core.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
